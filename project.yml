name: InterviewFlashcard

options:
  bundleIdPrefix: com.gaoguobin
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: 0.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: ""

targets:
  InterviewFlashcard:
    type: application
    platform: iOS
    sources:
      - path: InterviewFlashcard
    dependencies:
      - package: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoguobin.InterviewFlashcard
        PRODUCT_NAME: InterviewFlashcard
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "面试闪卡"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "用于录制面试回答，录音仅保存在本机。"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "用于在设备端将面试回答转成文字。"
        INFOPLIST_KEY_UIFileSharingEnabled: true
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - InterviewFlashcardTests
      gatherCoverageData: true

  InterviewFlashcardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InterviewFlashcardTests
    dependencies:
      - target: InterviewFlashcard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoguobin.InterviewFlashcardTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete
