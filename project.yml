name: InterviewFlashcard

options:
  bundleIdPrefix: com.gaoguobin
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: 0.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: ""

targets:
  InterviewFlashcardCore:
    type: framework
    platform: iOS
    sources:
      - path: InterviewFlashcard
        excludes:
          - App/InterviewFlashcardApp.swift
          - App/InterviewFlashcard-Info.plist
          - Resources
    dependencies:
      - package: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoguobin.InterviewFlashcardCore
        PRODUCT_NAME: InterviewFlashcardCore
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete

  InterviewFlashcard:
    type: application
    platform: iOS
    sources:
      - path: InterviewFlashcard/App/InterviewFlashcardApp.swift
      - path: InterviewFlashcard/Resources
        buildPhase: resources
    dependencies:
      - target: InterviewFlashcardCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoguobin.InterviewFlashcard
        PRODUCT_NAME: InterviewFlashcard
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: InterviewFlashcard/App/InterviewFlashcard-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - InterviewFlashcardTests
        - InterviewFlashcardUITests
      gatherCoverageData: true

  InterviewFlashcardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InterviewFlashcard
        excludes:
          - App/InterviewFlashcardApp.swift
          - App/InterviewFlashcard-Info.plist
          - Resources
      - path: InterviewFlashcardTests
        excludes:
          - TestHost
    dependencies:
      - package: Markdown
      - target: InterviewFlashcardTestHost
      - target: InterviewFlashcardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoguobin.InterviewFlashcardTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/InterviewFlashcardTestHost.app/InterviewFlashcardTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: complete

  InterviewFlashcardTestHost:
    type: application
    platform: iOS
    sources:
      - path: InterviewFlashcardTests/TestHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoguobin.InterviewFlashcardTestHost
        PRODUCT_NAME: InterviewFlashcardTestHost
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete

  InterviewFlashcardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: InterviewFlashcardUITests
    dependencies:
      - target: InterviewFlashcard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoguobin.InterviewFlashcardUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: InterviewFlashcard
        SWIFT_STRICT_CONCURRENCY: complete
